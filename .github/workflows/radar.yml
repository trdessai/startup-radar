name: startup-radar

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and often fires a few
    # minutes late under load — fine for a news feed. 5 min is the hard minimum.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

# Runs must not overlap, or two jobs race to push the state file.
concurrency:
  group: startup-radar
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the state file back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan sources
        env:
          # Optional. Leave the secret unset to run dashboard-only.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python radar.py

      # Committing does three jobs at once: state/seen.json is the dedupe memory,
      # public/data.json is what the Vercel dashboard reads, and the commit itself
      # counts as repository activity — which is what stops GitHub disabling the
      # schedule after 60 days of inactivity on a public repo.
      - name: Save state and dashboard data
        run: |
          git config user.name  "startup-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json public/data.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "radar $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            echo "push failed, rebasing and retrying"
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "could not push state after 3 attempts"
          exit 1
