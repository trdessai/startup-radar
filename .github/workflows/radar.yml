name: startup-radar

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and often fires a few
    # minutes late under load — fine for a news feed. 5 min is the hard minimum.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

# Runs must not overlap, or two jobs race to push the state file.
concurrency:
  group: startup-radar
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the state file back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch TIP, not github.sha. A queued run is pinned to the
      # commit that triggered it, so without this it works from stale state and
      # collides on push with whatever landed in the meantime. This is the fix that
      # prevents the collision; the retry loop below is only a safety net.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Show what we're working from
        run: |
          echo "push logic: v2 (reset + merge_state.py)"
          echo "branch:     ${GITHUB_REF_NAME}"
          echo "trigger sha ${GITHUB_SHA}"
          echo "checked out $(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan sources
        env:
          # Optional. Leave the secret unset to run dashboard-only.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python radar.py

      # Committing does three jobs at once: state/seen.json is the dedupe memory,
      # public/data.json is what the Vercel dashboard reads, and the commit itself
      # counts as repository activity — which is what stops GitHub disabling the
      # schedule after 60 days of inactivity on a public repo.
      - name: Save state and dashboard data
        run: |
          set -e
          git config user.name  "startup-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # These two files are generated, not authored. If another run pushed while
          # this one was working, `git pull --rebase` conflicts on them every time
          # (both sides rewrote the same JSON) and leaves the repo mid-rebase on a
          # detached HEAD, which breaks every retry after it. So: keep our copies
          # aside, reset hard to the remote, and merge ours in by key. Deterministic,
          # lossless, and it can never leave git in a broken state.
          tmp="$(mktemp -d)"
          cp state/seen.json "$tmp/seen.json"
          cp public/data.json "$tmp/data.json"

          for attempt in 1 2 3 4 5; do
            git add state/seen.json public/data.json
            if git diff --staged --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -q -m "radar $(date -u '+%Y-%m-%d %H:%M UTC')"

            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            echo "remote moved ahead - merging and retrying"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python merge_state.py "$tmp/seen.json" "$tmp/data.json"
            sleep $((attempt * 3))
          done

          echo "could not push after 5 attempts"
          exit 1
